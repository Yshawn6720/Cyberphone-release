# The Cloudflare Tunnel points at relay:8787, which is this gateway. Calls go to their own relay process so a call
# room that overloads workerd (four members talking in a dozen rooms crashed it) cannot drop parties, Jams or games.
map $arg_kind $relay_backend {
    call    relay-call:8787;
    default relay-main:8787;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8787;
    # Docker's DNS, re-resolved so a restarted relay container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        return 204;
    }

    location / {
        proxy_pass http://$relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # A room lives at most 6 hours and an idle party socket can stay silent for long stretches.
        proxy_read_timeout 7h;
        proxy_send_timeout 7h;
    }
}
